name: Build Mizwala APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:   # Permet de déclencher manuellement depuis l'onglet Actions

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      - name: Generate native splash
        run: dart run flutter_native_splash:create

      - name: Analyze code
        run: flutter analyze --no-fatal-infos

      - name: Build APK (release)
        run: flutter build apk --release --no-shrink

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mizwala-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Create GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
          name: Mizwala ${{ github.ref_name }}
          body: |
            ## Mizwala ${{ github.ref_name }}
            
            Application de prière pour Marrakech — calcul 100% local.
            
            ### Installation
            1. Téléchargez `app-release.apk`
            2. Sur Android : Paramètres → Sécurité → Sources inconnues → Installer
