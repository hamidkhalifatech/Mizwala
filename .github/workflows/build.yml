name: Build Mizwala APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          path: mizwala_src

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: 'stable'
          cache: true

      - name: Create Flutter project scaffold
        run: flutter create --org com.mizwala --project-name mizwala mizwala_app

      - name: Copy our source files over the scaffold
        run: |
          cp mizwala_src/lib/prayer_times.dart       mizwala_app/lib/prayer_times.dart
          cp mizwala_src/lib/mizwala_dial.dart        mizwala_app/lib/mizwala_dial.dart
          cp mizwala_src/lib/home_screen.dart         mizwala_app/lib/home_screen.dart
          cp mizwala_src/lib/main.dart                mizwala_app/lib/main.dart
          cp mizwala_src/lib/settings_screen.dart     mizwala_app/lib/settings_screen.dart
          cp mizwala_src/lib/notification_service.dart mizwala_app/lib/notification_service.dart
          cp mizwala_src/pubspec.yaml                  mizwala_app/pubspec.yaml
          mkdir -p mizwala_app/assets/icon mizwala_app/assets/splash
          cp mizwala_src/assets/icon/mizwala_icon.png   mizwala_app/assets/icon/mizwala_icon.png
          cp mizwala_src/assets/splash/mizwala_splash.png mizwala_app/assets/splash/mizwala_splash.png
          cp mizwala_src/android/app/src/main/AndroidManifest.xml \
             mizwala_app/android/app/src/main/AndroidManifest.xml

      - name: Upgrade Kotlin version for compatibility
        working-directory: mizwala_app
        run: |
          sed -i 's/org.jetbrains.kotlin.android" version "[^"]*"/org.jetbrains.kotlin.android" version "2.1.0"/' android/settings.gradle

      - name: Get dependencies
        working-directory: mizwala_app
        run: flutter pub get

      - name: Generate launcher icons
        working-directory: mizwala_app
        run: dart run flutter_launcher_icons

      - name: Generate native splash
        working-directory: mizwala_app
        run: dart run flutter_native_splash:create

      - name: Build APK (release)
        working-directory: mizwala_app
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mizwala-release-apk
          path: mizwala_app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
